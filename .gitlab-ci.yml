stages:
  - build
  - deploy

variables:
  GIT_DEPTH: "0"

build:
  stage: build
  image: "$CI_REGISTRY/tools/typst-cv:latest"
  tags:
    - dind-runner
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - python3 scripts/build.py
  artifacts:
    paths:
      - site/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

deploy:
  stage: deploy
  image: "$CI_REGISTRY/tools/typst-cv:latest"
  tags:
    - dind-runner
  before_script:
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVKEY}" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\tLogLevel QUIET\n\n" > ~/.ssh/config'
  script:
    - rsync -avu -zz -e 'ssh -p 2244' --no-perms --omit-dir-times site/ "${PRODUCTION_DESTINATION}/ad/"
    - |
      curl --fail-with-body -sS -X POST \
        "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
        -H "Authorization: Bearer ${CF_PURGE_TOKEN}" \
        -H "Content-Type: application/json" \
        --data '{"files":[
          "https://${DOMAIN}/cv_alexanderdunkel.pdf",
          "https://${DOMAIN}/cv_alexanderdunkel_audit.pdf",
          "https://${DOMAIN}/cv.html",
          "https://${DOMAIN}/cv_audit.html"
        ]}'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
