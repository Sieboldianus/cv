closing_text: |-
  A visual counterpart of this CV can be found at [alexanderdunkel.com/time](https://alexanderdunkel.com/time)

  I try to do transparent, open, and reproducible science, as much as possible. Most of what I do or create is shared at [links.alexanderdunkel.com/](https://links.alexanderdunkel.com/). I also occasionally toot [@alex@himself.alexanderdunkel.com](https://himself.alexanderdunkel.com/). My personal efforts at self-hosting and digital liberation are documented at [du.nkel.dev](https://du.nkel.dev).

  My git repositories can be found at [github.com/sieboldianus](https://github.com/sieboldianus), [gitlab.vgiscience.de/ad](https://gitlab.vgiscience.de/ad), and [gitlab.hrz.tu-chemnitz.de/s7398234--tu-dresden.de](https://gitlab.hrz.tu-chemnitz.de/s7398234--tu-dresden.de).
