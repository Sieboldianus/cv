name: production
exclude_tags:
  - audit-only
show_declined_grants: false
show_phd_project_work: false

rules:
  theses:
    keep_where:
      field: level
      in: [phd]
    aggregate_remaining:
      period: "{min_year}–{max_year}"
      template: >
        **Master & Diploma Supervision:** Supervised and co-supervised {count} Master
        and Diploma theses ({min_year}–{max_year}) at {institutions_list} on geosocial
        media analytics, generative AI cartography, LLMs, and privacy-preserving VGI.

  freelance:
    keep_where:
      field: highlight
      equals: true
    aggregate_remaining:
      period: "{min_year}–{max_year}"
      template: >
        **Selected Consulting & Exhibitions ({count} projects):** GIS/social media data
        analyses, exhibition graphics, and design competition contributions (incl. PSY:PLAN GbR,
        Diller Scofidio + Renfro / Field Operations, WEST 8, DATAlab Toronto).

closing_note: >
  This is the curated version of my CV. I have omitted or summarized information that I found of no broader relevancy. The complete, unredacted audit version is published for
  transparency at
  [alexanderdunkel.com/cv_alexanderdunkel_audit.pdf](https://www.alexanderdunkel.com/cv_alexanderdunkel_audit.pdf).
  This CV is built with Typst and CI&CD. Public Source: [github.com/Sieboldianus/cv](https://github.com/Sieboldianus/cv).
